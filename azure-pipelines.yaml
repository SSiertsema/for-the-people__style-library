trigger:
  branches:
    include:
      - production

variables:
  # Azure Resource Manager connection created during pipeline creation
  azureARMConnection: "PZH - Microsoft Azure Enterprise"

  # Web app name and resource group
  webAppName: "af85ec9a25a854c96b226964"
  imageName: "style-library"
  rg: "pzh-style-library"
  SlotName: "production"
  specifySlotOrASE: false

  # Azure Container Registry to publish to
  azureContainerRegistry: "af85ec9a25a854c96b226964.azurecr.io"

  # Agent VM image name
  vmImageName: "ubuntu-latest"

stages:
  - stage: Build
    displayName: "Build stage ${{ variables.webAppName }}/${{ variables.SlotName }}"
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@1
            displayName: Build an image
            inputs:
              azureSubscriptionEndpoint: $(azureARMConnection)
              azureContainerRegistry: $(azureContainerRegistry)
              imageName: $(imageName):$(Build.SourceBranchName)
              includeSourceTags: true
              includeLatestTag: true
          - task: Bash@3
            displayName: Save Docker Image
            inputs:
              targetType: "inline"
              script: |
                docker save $(azureContainerRegistry)/$(imageName):$(Build.SourceBranchName) -o $(Pipeline.Workspace)/$(imageName).tar
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: "$(Pipeline.Workspace)/$(imageName).tar"
              artifact: "$(imageName)"
              publishLocation: "pipeline"

  - stage: Deploy
    displayName: "Deploy slot -> ${{ variables.SlotName }}"
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: Deploy
        displayName: Deploy
        pool:
          vmImage: $(vmImageName)
        environment: $(environmentName)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadPipelineArtifact@2
                  inputs:
                    buildType: "current"
                    artifactName: "$(imageName)"
                    targetPath: "$(Pipeline.Workspace)"
                - task: Bash@3
                  displayName: Load Docker Image
                  inputs:
                    targetType: "inline"
                    workingDirectory: "$(Pipeline.Workspace)"
                    script: |
                      docker load --input $(imageName).tar
                - task: Docker@1
                  displayName: "Push an image $(azureContainerRegistry)/$(imageName):$(Build.SourceBranchName)"
                  inputs:
                    azureSubscriptionEndpoint: $(azureARMConnection)
                    azureContainerRegistry: $(azureContainerRegistry)
                    command: "Push an image"
                    imageName: "$(azureContainerRegistry)/$(imageName):$(Build.SourceBranchName)"
                - task: AzureAppServiceManage@0
                  displayName: "Restart Azure App Service: $(webAppName)-$(SlotName)"
                  inputs:
                    azureSubscription: $(azureARMConnection)
                    Action: Restart Azure App Service
                    WebAppName: $(webAppName)
                    ResourceGroupName: $(rg)
                    specifySlotOrASE: $(specifySlotOrASE)
                    Slot: "$(SlotName)"
