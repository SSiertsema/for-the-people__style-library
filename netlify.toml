[build]
  command = "npm run build:tokens && cd server && npm install && npm run build && echo '=== Checking output locations ===' && ls -la . && ls -la .output/ 2>/dev/null || echo 'No .output' && ls -la ../.netlify/ 2>/dev/null || echo 'No .netlify'"
  publish = "server/.output/public"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
