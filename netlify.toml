[build]
  command = "echo '=== Starting build ===' && npm run build:tokens && echo '=== Tokens built ===' && cd server && npm install && echo '=== Server deps installed ===' && npm run build && echo '=== Build complete ===' && ls -la .output/"
  publish = "server/.output/public"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
